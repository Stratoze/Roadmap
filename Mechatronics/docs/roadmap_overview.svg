  </defs>
  <rect class="box" x="70" y="130" width="280" height="86" rx="14"/>
  <text class="title" x="210" y="162" text-anchor="middle">Phase 0</text>
  <text class="sub" x="210" y="188" text-anchor="middle">Foundations and Vocabulary</text>
  <rect class="box" x="410" y="130" width="280" height="86" rx="14"/>
  <text class="title" x="550" y="162" text-anchor="middle">Phase 1</text>
  <text class="sub" x="550" y="188" text-anchor="middle">Signals, Actuators, Dynamics</text>
  <rect class="box" x="750" y="130" width="280" height="86" rx="14"/>
  <text class="title" x="890" y="162" text-anchor="middle">Phase 2</text>
  <text class="sub" x="890" y="188" text-anchor="middle">Embedded Real-Time Control</text>
  <rect class="box" x="70" y="310" width="280" height="86" rx="14"/>
  <text class="title" x="210" y="342" text-anchor="middle">Phase 3</text>
  <text class="sub" x="210" y="368" text-anchor="middle">Mechanical, PCB, Verification</text>
  <rect class="box" x="410" y="310" width="280" height="86" rx="14"/>
  <text class="title" x="550" y="342" text-anchor="middle">Phase 4</text>
  <text class="sub" x="550" y="368" text-anchor="middle">Capstone and Safety Integration</text>
  <rect class="box" x="750" y="310" width="280" height="86" rx="14"/>
  <text class="title" x="890" y="342" text-anchor="middle">Phase 5</text>
  <text class="sub" x="890" y="368" text-anchor="middle">Portfolio and Delivery</text>
  <path class="arrow" d="M350 173 H405"/>
  <path class="arrow" d="M690 173 H745"/>
  <path class="arrow" d="M890 216 C890 260 210 260 210 305"/>
  <path class="arrow" d="M350 353 H405"/>
  <path class="arrow" d="M690 353 H745"/>
  <text x="550" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Status lives in ROADMAP.md. Evidence lives in docs/captures.</text>
