<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#111827"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#f9fafb">Mechatronics Roadmap</text>
  <text x="550" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Predict → Attempt → Compare → Explain the gap → Integrate → Maintain</text>
  <defs>
    <style>
      .box { fill: #1f2937; stroke: #60a5fa; stroke-width: 2; }
      .title { fill: #f9fafb; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .sub { fill: #d1d5db; font-family: Arial, sans-serif; font-size: 13px; }
      .arrow { stroke: #9ca3af; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
